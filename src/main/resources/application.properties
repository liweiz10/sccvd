spring.application.name=sccvd
server.port=8080
mybatis.mapper-locations=classpath:mappers/*xml
mybatis.type-aliases-package=com.lcq.cell.mybatis.entity
mybatis.configuration.call-setters-on-nulls=true
logging.level.com.lcq.cell.mapper=debug
#logging: info, debug, warn, error
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.name=defaultDataSource
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/scnervedb?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&lowerCaseTableNames=true
spring.datasource.username=root
spring.datasource.password=*
spring.thymeleaf.cache=true
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true
spring.thymeleaf.content-type=text/html
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.excluded-view-names=
spring.thymeleaf.mode=HTML5
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
pagehelper.helperDialect=mysql
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=templates
spring.freemarker.cache=false
server.max-http-request-header-size=102400
#由于以下几个样本细胞数多，处理scenic时会被kill，所以下采样了25000个细胞，故在网站可视化TF表达时需要读取下采样样本表名后缀为_metadata_downsample，使用函数为Detail.java-getTfUmapPosition
app.stroke-names=Sample_024,Sample_026,Sample_038,Sample_041,Sample_042,Sample_043,Sample_045,Sample_046,Sample_047,Sample_048,Sample_049,Sample_050,Sample_051,Sample_052,Sample_053,Sample_054,Sample_055,Sample_056,Sample_057,Sample_060,Sample_062,Sample_064,Sample_065,Sample_071,Sample_072,Sample_073,Sample_074,Sample_075,Sample_076,Sample_077,Sample_078,Sample_079,Sample_080,Sample_081,Sample_082,Sample_083,Sample_084,Sample_085

spring.resources.static-locations=classpath:/static/,classpath:/dist/,file:D:/Workspace/webdata/,file:/data/webdata/scStroke/
#com.path.workPath=D:/Workspace/webdata/
#com.path.expersionCodePath=D:/Workspace/idea/stroke/src/main/resources/static/code/getData.R
com.path.workPath=/data/webdata/scStroke/
com.path.expersionCodePath=/data/apache-tomcat-9.0.118/webapps/sccvd/WEB-INF/classes/static/code/getData.R

